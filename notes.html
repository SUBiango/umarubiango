  <!-- Main -->
  <main id="main" tabindex="-1">
    <div class="page-wrapper">

      <!-- Notes list view -->
      <div id="notes-list-view" class="note-list-view">
        <header class="page-header">
          <h1>notes</h1>
          <p class="page-header__sub">// long-form writing, when it's earned</p>
        </header>

        <div class="terminal-block" style="margin-bottom: var(--space-6);" role="region" aria-label="Notes directory">
          <span class="terminal-line">
            <span class="t-prompt" aria-hidden="true">&gt;</span>
            <span class="t-cmd">ls notes/</span>
          </span>
        </div>

        <nav aria-label="Notes list">
          <ul id="notes-list" class="notes-list" aria-live="polite">
            <li><span class="state-loading u-mono">loading...</span></li>
          </ul>
        </nav>
      </div>

      <!-- Full note view (hidden until note is selected) -->
      <div id="notes-note-view" class="note-view" aria-live="polite">
        <button id="notes-back-btn" class="note-view__back" aria-label="Back to notes list">
          notes
        </button>

        <article id="notes-article">
          <!-- Populated by notes.js -->
        </article>
      </div>

    </div>
  </main>

  <!-- Netlify build-time form detection fallback -->
  <form name="newsletter" method="POST" data-netlify="true" hidden>
    <input type="hidden" name="form-name" value="newsletter">
    <input type="hidden" name="form-type" value="newsletter">
    <input type="hidden" name="note_slug" value="">
    <input type="email" name="email">

    <div class="page-wrapper">

      <header class="page-header">
        <h1>contact</h1>
        <p class="page-header__sub">// send a message</p>
      </header>

      <div class="terminal-block" style="margin-bottom: var(--space-8);" role="region" aria-label="Contact prompt">
        <span class="terminal-line">
          <span class="t-prompt" aria-hidden="true">&gt;</span>
          <span class="t-cmd">send_message</span>
        </span>
        <span class="t-out">I read everything. I reply when it's worth it to both of us.</span>
      </div>

      <!-- Contact Form -->
      <div class="contact-form-wrap" id="contact-form-wrap">
        <form
          name="contact"
          method="POST"
          data-netlify="true"
          netlify-honeypot="bot-field"
          id="contact-form"
          novalidate
        >
          <!-- Honeypot -->
          <p class="u-sr-only" aria-hidden="true">
            <label>Don't fill this out: <input name="bot-field"></label>
          </p>
          <input type="hidden" name="form-name" value="contact">

          <div class="form-group">
            <label for="name">name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="your name"
              required
              autocomplete="name"
            >
          </div>

          <div class="form-group">
            <label for="email">email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="your@email.com"
              required
              autocomplete="email"
            >
          </div>

          <div class="form-group">
            <label for="message">message</label>
            <textarea
              id="message"
              name="message"
              placeholder="what's on your mind"
              required
            ></textarea>
          </div>

          <button type="submit" class="form-submit">send →</button>
        </form>

        <!-- Success state (hidden until form submits) -->
        <div id="contact-success" aria-live="polite" style="display: none;">
          <div class="terminal-block" role="region" aria-label="Message sent confirmation">
            <span class="terminal-line">
              <span class="t-prompt" aria-hidden="true">&gt;</span>
              <span class="t-cmd">message_sent</span>
            </span>
            <span class="t-out">got it. i'll be in touch.</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="assets/js/terminal.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      initNav();

      var form = document.getElementById('contact-form');
      var success = document.getElementById('contact-success');

      if (!form) return;

      form.addEventListener('submit', function(e) {
        e.preventDefault();

        var data = new FormData(form);

        fetch('/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams(data).toString(),
        })
          .then(function(response) {
            if (response.ok) {
              form.style.display = 'none';
              success.style.display = 'block';
              success.focus();
            } else {
              alert('Something went wrong. Please try again or email hello@umarubiango.com directly.');
            }
          })
          .catch(function() {
            alert('Could not send. Please email hello@umarubiango.com directly.');
          });
      });
    });
  </script>

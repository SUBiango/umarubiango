[build]
  publish = "."
  functions = "netlify/functions"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self'; img-src 'self' https: data:; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none';"

# Cache JS and CSS: always revalidate via ETag (no immutable — no content hashing)
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, no-cache"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, no-cache"

# Cache images for 1 year (rarely change)
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache fonts for 1 year
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache now.json: always revalidate (updated content)
[[headers]]
  for = "/data/now.json"
  [headers.values]
    Cache-Control = "public, no-cache"

# Cache other data files for 5 minutes
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# HTML: always revalidate
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, no-cache"

# Root index
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, no-cache"
